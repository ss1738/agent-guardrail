[project]
name = "qedra"
version = "0.2.0"
description = "A runtime gate for autonomous coding agents. It blocks destructive tool calls (force-push main, rm -rf, secret exfil) while letting real work through. Its git-branch sub-policy is machine-checked by z3; the rest is high-precision heuristics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Satyawan Singh" }]
dependencies = ["z3-solver>=4.12", "cryptography>=42"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
qedra-verify = "qedra.verify_cli:main"
qedra-attest = "qedra.attest_cli:main"
qedra-redact = "qedra.redact_cli:main"
qedra-policy = "qedra.policy_cli:main"
qedra-serve = "qedra.verify_server:main"
qedra-hook = "qedra.claude_code_hook:main"
qedra-mcp = "qedra.mcp_server:main"

[project.urls]
Homepage = "https://github.com/ss1738/qedra"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qedra"]
