[project]
name = "agent-guardrail"
version = "0.1.0"
description = "A formally-checked runtime shield for autonomous coding agents. It provably blocks destructive tool calls (force-push main, rm -rf, secret exfil) while letting real work through."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Satyawan Singh" }]
dependencies = ["z3-solver>=4.12", "cryptography>=42"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
agent-guardrail-verify = "agent_guardrail.verify_cli:main"
agent-guardrail-redact = "agent_guardrail.redact_cli:main"

[project.urls]
Homepage = "https://github.com/ss1738/agent-guardrail"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_guardrail"]
