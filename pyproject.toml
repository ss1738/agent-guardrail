[project]
name = "agent-guardrail"
version = "0.2.0"
description = "A runtime gate for autonomous coding agents. It blocks destructive tool calls (force-push main, rm -rf, secret exfil) while letting real work through. Its git-branch sub-policy is machine-checked by z3; the rest is high-precision heuristics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Satyawan Singh" }]
dependencies = ["z3-solver>=4.12", "cryptography>=42"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
agent-guardrail-verify = "agent_guardrail.verify_cli:main"
agent-guardrail-redact = "agent_guardrail.redact_cli:main"
agent-guardrail-policy = "agent_guardrail.policy_cli:main"
agent-guardrail-serve = "agent_guardrail.verify_server:main"
agent-guardrail-hook = "agent_guardrail.claude_code_hook:main"

[project.urls]
Homepage = "https://github.com/ss1738/agent-guardrail"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_guardrail"]
