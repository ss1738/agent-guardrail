name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install z3-solver cryptography
      - name: guardrail suite
        run: python3 tests/test_guardrail.py
      - name: control-plane suite
        run: python3 tests/test_control_plane.py
