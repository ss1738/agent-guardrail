name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .            # installs the package + deps (z3-solver, cryptography)
      - name: guardrail suite
        run: python3 tests/test_guardrail.py
      - name: control-plane suite
        run: python3 tests/test_control_plane.py
      - name: zk suite
        run: python3 tests/test_zk.py
      - name: zk elliptic-curve suite
        run: python3 tests/test_zk_ec.py
      - name: zk receipt suite
        run: python3 tests/test_zk_receipt.py
      - name: tool-gate suite
        run: python3 tests/test_tool_gate.py
      - name: policy-spec suite
        run: python3 tests/test_policy_spec.py
      - name: policy-cli suite
        run: python3 tests/test_policy_cli.py
      - name: audit-log suite
        run: python3 tests/test_audit_log.py
      - name: cli smoke (packaging + console scripts)
        run: |
          agent-guardrail-verify --help
          agent-guardrail-policy init --protected main,release
